[project]
name = "ostrich-dispatcher"
version = "0.1.0"
description = "Validates and delivers queued user messages (Cloud Pub/Sub) to the user's sandbox"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-cloud-pubsub>=2.21.0",
    "psycopg[binary,pool]>=3.2.0",
    "requests>=2.31.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B"]

[dependency-groups]
dev = ["pytest>=8.0.0", "ruff>=0.3.0"]
